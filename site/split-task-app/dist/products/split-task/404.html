<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found · Manumit</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="theme-color" content="#344271" />
    <!-- Deep links into the app's pre-login screens (/login, /signup, /delete) are
         not real files, so static hosting lands here. Forward them to the app root
         with a hash route; the app reads it and restores the clean path itself. The
         deploy also rewrites those three exact paths - see Website/site/_redirects. -->
    <script>
      (function () {
        try {
          var m = window.location.pathname.match(/\/(login|signup|delete)\/?$/);
          if (m) window.location.replace('./#/' + m[1]);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta name="description" content="That address does not match anything on this site. Link may be incorrect, page moved, or never was made. Home, products, help & support, and policies are one click away." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="404 - Page Not Found · Manumit" />
    <meta name="twitter:description" content="That address does not match anything on this site. Link may be incorrect, page moved, or never was made. Home, products, help & support, and policies are one click away." />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100vh;
        background: #ffffff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      .card {
        max-width: 420px; padding: 36px 28px;
        border-radius: 20px; text-align: center;
      }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 18px;
        border-radius: 20px; background: #344271; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 900;
      }
      h1 { font-size: 22px; margin: 0 0 10px; color: #1a2235; }
      p  { font-size: 14px; line-height: 1.6; margin: 0 0 22px; color: #6b7386; }
      .links { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 8px; }
      .links a { display: block; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e6f0; background: #f6f7fb; color: #344271; font-weight: 700; font-size: 14px; text-decoration: none; }
      a.button {
        display: inline-block; padding: 12px 22px; border-radius: 12px;
        background: #344271; color: #fff; font-weight: 700; font-size: 14px;
        text-decoration: none; box-shadow: 0 2px 10px rgba(52, 66, 113, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #141a2b; }
        h1 { color: #f2f4fa; } p { color: #9aa3b8; }
        .links a { background: #1d2539; border-color: #2c3652; color: #dfe4f2; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">Split</div>
      <h1>Page not found</h1>
      <p>That address does not match anything on this site. Link may be incorrect, page moved, or never was made.</p>
      <ul class="links">
        <li><a href="/">Home</a></li>
        <li><a href="/products/">Products</a></li>
        <li><a href="/help/">Help &amp; Support</a></li>
        <li><a href="/policies/">Policies</a></li>
      </ul>
      <a class="button" href="./">Back to Split Task</a>
    </div>
  </body>
</html>
